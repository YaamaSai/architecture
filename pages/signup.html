    <!-- Theme & Auth Logic Scripts -->
    <script>
        // --- Theme Management ---
        const btn = document.getElementById('theme-toggle');
        const icon = btn.querySelector('i');

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            icon.className = 'ph-bold ph-sun';
        }

        btn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            icon.className = isDark ? 'ph-bold ph-sun' : 'ph-bold ph-moon';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // --- RTL Management ---
        const rtlBtn = document.getElementById('rtl-toggle');
        
        if (localStorage.getItem('dir') === 'rtl') {
            document.documentElement.setAttribute('dir', 'rtl');
        }

        rtlBtn.addEventListener('click', () => {
            const isRtl = document.documentElement.getAttribute('dir') === 'rtl';
            document.documentElement.setAttribute('dir', isRtl ? 'ltr' : 'rtl');
            localStorage.setItem('dir', isRtl ? 'ltr' : 'rtl');
        });

        // --- Password Show/Hide Toggle ---
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePassword.className = isPassword ? 'ph-bold ph-eye input-icon-right' : 'ph-bold ph-eye-slash input-icon-right';
        });

        // --- Simulated Signup Submit ---
        const signupForm = document.getElementById('signupForm');
        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            // Automatically log in user and redirect to client dashboard
            window.location.href = 'client-dashboard.html';
        });
    </script>
<script>
        // ── Home 2 Sidebar Logic ported to Home 1 ─────────────────────────────────────
        (function () {
            const sidebar = document.getElementById('h2NavSidebar');
            const hamburger = document.querySelector('.mobile-menu-toggle');
            const closeBtn = document.getElementById('h2CloseBtn');
            const themeBtn = document.getElementById('h2ThemeToggle');
            const themeIcon = document.getElementById('h2ThemeIcon');
            const rtlBtn = document.getElementById('h2RtlToggle');

            if (!sidebar || !hamburger) return; // safety check

            // ── Overlay ─────────────────────────────────────────────────────
            const overlay = document.createElement('div');
            overlay.id = 'h2-nav-overlay';
            document.querySelector('.header').appendChild(overlay);

            function openSidebar() {
                sidebar.classList.add('h2-open');
                overlay.classList.add('h2-show');
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('h2-open');
                overlay.classList.remove('h2-show');
                document.body.style.overflow = '';
            }

            hamburger.addEventListener('click', openSidebar);
            if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
            overlay.addEventListener('click', closeSidebar);

            // ── Dropdown accordion ───────────────────────────────────────────
            sidebar.querySelectorAll('.nav-dropdown > a').forEach(trigger => {
                trigger.addEventListener('click', function (e) {
                    const menu = this.nextElementSibling;
                    if (!menu || !menu.classList.contains('dropdown-menu')) return;
                    e.preventDefault();
                    const parent = this.parentElement;
                    const isOpen = parent.classList.contains('h2-dd-open');
                    sidebar.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('h2-dd-open'));
                    if (!isOpen) parent.classList.add('h2-dd-open');
                });
            });

            // Close sidebar when a leaf link is clicked
            sidebar.querySelectorAll('.dropdown-menu a, .h2-nav-body > a').forEach(a => {
                a.addEventListener('click', closeSidebar);
            });

            // ── Dark Mode toggle (sidebar) ──────────────────────────────────
            function syncThemeBtn() {
                const dark = document.body.classList.contains('dark-mode');
                if (themeIcon) themeIcon.className = dark ? 'ph-bold ph-sun' : 'ph-bold ph-moon';
                if (themeBtn) {
                    themeBtn.childNodes[1].textContent = dark ? ' Light Mode' : ' Dark Mode';
                    themeBtn.classList.toggle('h2-active', dark);
                }
            }

            if (themeBtn) {
                syncThemeBtn();
                themeBtn.addEventListener('click', () => {
                    document.body.classList.toggle('dark-mode');
                    const dark = document.body.classList.contains('dark-mode');
                    localStorage.setItem('theme', dark ? 'dark' : 'light');
                    syncThemeBtn();
                });
            }

            // ── RTL toggle (sidebar) ────────────────────────────────────────
            function syncRtlBtn() {
                const rtl = document.documentElement.getAttribute('dir') === 'rtl';
                if (rtlBtn) rtlBtn.classList.toggle('h2-active', rtl);
            }

            if (rtlBtn) {
                syncRtlBtn();
                rtlBtn.addEventListener('click', () => {
                    const rtl = document.documentElement.getAttribute('dir') === 'rtl';
                    document.documentElement.setAttribute('dir', rtl ? 'ltr' : 'rtl');
                    localStorage.setItem('dir', rtl ? 'ltr' : 'rtl');
                    syncRtlBtn();
                });
            }

            // ── Init state from localStorage ────────────────────────────────
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                syncThemeBtn();
            }
            if (localStorage.getItem('dir') === 'rtl') {
                document.documentElement.setAttribute('dir', 'rtl');
                syncRtlBtn();
            }
        })();
    </script>
</body>
</html>
