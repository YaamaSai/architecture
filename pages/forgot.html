<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | ArchStruct Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../assets/css/mobile-tablet.css">
<style>
        /* ═══════════════════════════════════════════════════
           HOME 2 — PREMIUM MOBILE / TABLET NAV (≤ 1024px)
           Desktop (> 1024px) is 100% untouched.
        ═══════════════════════════════════════════════════ */
        @media (max-width: 1023px) {

            /* ── Footer-style logo in the main header navbar ── */
            header.header .logo {
                display: flex !important;
                align-items: center !important;
                gap: 0.6rem !important;
                text-decoration: none !important;
            }

            header.header .logo .logo-icon {
                font-size: 2rem !important;
                color: var(--navy) !important;
                line-height: 1 !important;
                flex-shrink: 0 !important;
            }

            header.header .logo .logo-text {
                display: flex !important;
                flex-direction: column !important;
                line-height: 1.1 !important;
            }

            header.header .logo .logo-title {
                font-size: 1.5rem !important;
                font-weight: 800 !important;
                color: var(--navy) !important;
                letter-spacing: -0.02em !important;
                line-height: 1 !important;
            }

            body.dark-mode header.header .logo .logo-title {
                color: var(--text-dark) !important;
            }

            header.header .logo .logo-subtitle {
                font-size: 0.8rem !important;
                font-weight: 600 !important;
                letter-spacing: 1.5px !important;
                text-transform: uppercase !important;
                color: var(--gold-dark) !important;
                line-height: 1 !important;
            }

            /* ── Same standard logo inside the sidebar ── */
            .h2-sidebar-head .logo .logo-icon {
                font-size: 2rem !important;
                color: var(--navy) !important;
                flex-shrink: 0 !important;
            }

            .h2-sidebar-head .logo .logo-text {
                display: flex !important;
                flex-direction: column !important;
                line-height: 1.1 !important;
            }

            .h2-sidebar-head .logo .logo-title {
                font-size: 1.5rem !important;
                font-weight: 800 !important;
                color: var(--navy) !important;
                letter-spacing: -0.02em !important;
                line-height: 1 !important;
            }

            body.dark-mode .h2-sidebar-head .logo .logo-title {
                color: var(--text-dark) !important;
            }

            .h2-sidebar-head .logo .logo-subtitle {
                font-size: 0.8rem !important;
                font-weight: 600 !important;
                letter-spacing: 1.5px !important;
                text-transform: uppercase !important;
                color: var(--gold-dark) !important;
                line-height: 1 !important;
            }

            html, body {
                overflow-x: hidden !important;
                width: 100%;
            }

            nav.nav-links {
                position: fixed !important;
                top: 0 !important;
                right: 0 !important;
                width: 70% !important;
                max-width: 70% !important;
                bottom: 0 !important;
                height: 100dvh !important;
                background: #ffffff !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 0 !important;
                padding: 0 !important;
                transform: translateX(110%) !important;
                visibility: hidden !important;
                transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1), visibility 0s 0.38s !important;
                z-index: 10000 !important;
                box-shadow: -8px 0 40px rgba(0, 0, 0, 0.18) !important;
                border-radius: 0 !important;
                overflow: hidden !important;
            }

            body.dark-mode nav.nav-links {
                background: #111111 !important;
            }

            nav.nav-links.h2-open {
                transform: translateX(0) !important;
                visibility: visible !important;
                transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1), visibility 0s 0s !important;
            }

            /* ── Sidebar header (logo + close btn) ── */
            .h2-sidebar-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 1.25rem 1.5rem 1.25rem 1.5rem;
                border-bottom: 1px solid rgba(0, 0, 0, 0.08);
                background: #ffffff;
                flex-shrink: 0;
            }

            body.dark-mode .h2-sidebar-head {
                background: #111111;
                border-bottom-color: rgba(255, 255, 255, 0.07);
            }

            .h2-sidebar-head .logo {
                display: flex !important;
                align-items: center;
                gap: 0.5rem;
                text-decoration: none;
            }

            .h2-sidebar-head .logo-title {
                font-size: 1.1rem !important;
                font-weight: 800;
                color: #1a1a1a !important;
            }

            body.dark-mode .h2-sidebar-head .logo-title {
                color: #ffffff !important;
            }

            .h2-sidebar-head .logo .logo-icon {
                font-size: 1.8rem !important;
                color: var(--gold) !important;
            }

            /* Hide original mobile-menu-header — we use h2-sidebar-head */
            .mobile-menu-header {
                display: none !important;
            }

            /* ── Close button ── */
            .h2-close-btn {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: rgba(0, 0, 0, 0.06);
                border: none;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                color: #1a1a1a;
                font-size: 1.2rem;
                transition: background 0.2s, transform 0.2s;
                flex-shrink: 0;
            }

            body.dark-mode .h2-close-btn {
                background: rgba(255, 255, 255, 0.1);
                color: #ffffff;
            }

            .h2-close-btn:hover {
                background: rgba(197, 168, 128, 0.15);
                color: var(--gold);
                transform: rotate(90deg);
            }

            /* ── Scrollable nav body ── */
            .h2-nav-body {
                flex: 1;
                overflow-y: auto;
                padding: 0.75rem 0;
                display: flex;
                flex-direction: column;
                gap: 0;
            }

            .h2-nav-body::-webkit-scrollbar {
                width: 4px;
            }

            .h2-nav-body::-webkit-scrollbar-thumb {
                background: var(--gold);
                border-radius: 2px;
            }

            /* ── Nav links inside sidebar ── */
            nav.nav-links a {
                display: flex !important;
                align-items: center !important;
                gap: 0.75rem !important;
                padding: 0.9rem 1.5rem !important;
                font-size: 0.95rem !important;
                font-weight: 600 !important;
                color: #333333 !important;
                border-radius: 0 !important;
                border-bottom: 1px solid rgba(0, 0, 0, 0.05) !important;
                transition: background 0.18s, color 0.18s, padding-left 0.18s !important;
                width: 100% !important;
                background: transparent !important;
            }

            body.dark-mode nav.nav-links a {
                color: #cccccc !important;
                border-bottom-color: rgba(255, 255, 255, 0.05) !important;
            }

            nav.nav-links a:hover {
                background: rgba(197, 168, 128, 0.08) !important;
                color: var(--gold) !important;
                padding-left: 2rem !important;
            }

            nav.nav-links a.active {
                color: #ffffff !important;
                background: var(--navy) !important;
                border-left: 3px solid var(--navy) !important;
                padding-left: calc(1.5rem - 3px) !important;
            }

            /* Icons visible on mobile */
            .mobile-nav-icon {
                display: inline-block !important;
                font-size: 1rem;
                color: var(--gold);
                flex-shrink: 0;
            }

            /* ── Dropdown accordion ── */
            .nav-dropdown {
                width: 100% !important;
                position: static !important;
            }

            .nav-dropdown>a {
                position: relative !important;
            }

            .nav-dropdown>a .ph-caret-down {
                margin-left: auto !important;
                flex-shrink: 0;
                transition: transform 0.3s ease;
                opacity: 0.6;
            }

            .nav-dropdown.h2-dd-open>a .ph-caret-down {
                transform: rotate(180deg);
                opacity: 1;
                color: var(--gold);
            }

            .dropdown-menu {
                position: static !important;
                opacity: 1 !important;
                visibility: visible !important;
                transform: none !important;
                box-shadow: none !important;
                background: rgba(0, 0, 0, 0.03) !important;
                border: none !important;
                padding: 0 !important;
                min-width: unset !important;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.32s ease;
                border-radius: 0 !important;
            }

            body.dark-mode .dropdown-menu {
                background: rgba(255, 255, 255, 0.03) !important;
            }

            .nav-dropdown.h2-dd-open .dropdown-menu {
                max-height: 300px;
            }

            .dropdown-menu a {
                padding: 0.75rem 1.5rem 0.75rem 3rem !important;
                font-size: 0.88rem !important;
                font-weight: 500 !important;
                color: #555555 !important;
                border-bottom: 1px solid rgba(0, 0, 0, 0.04) !important;
                border-radius: 0 !important;
                display: flex !important;
                gap: 0.5rem !important;
            }

            body.dark-mode .dropdown-menu a {
                color: #999999 !important;
                border-bottom-color: rgba(255, 255, 255, 0.04) !important;
            }

            .dropdown-menu a:hover {
                background: rgba(197, 168, 128, 0.1) !important;
                color: var(--gold) !important;
                padding-left: 3.5rem !important;
            }

            /* ── Sidebar footer (login + toggles) ── */
            .h2-sidebar-foot {
                flex-shrink: 0;
                padding: 1rem 1.5rem 1.5rem;
                border-top: 1px solid rgba(0, 0, 0, 0.08);
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
                background: #ffffff;
            }

            body.dark-mode .h2-sidebar-foot {
                background: #111111;
                border-top-color: rgba(255, 255, 255, 0.07);
            }

            .h2-sidebar-foot .btn {
                width: 100% !important;
                justify-content: center !important;
                font-size: 0.95rem !important;
                padding: 0.8rem 1.5rem !important;
            }

            /* ── Toggle row (dark + RTL) inside sidebar ── */
            .h2-toggle-row {
                display: flex;
                gap: 0.75rem;
                width: 100%;
            }

            .h2-toggle-btn {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
                padding: 0.65rem 0.75rem;
                border-radius: 10px;
                border: 1px solid rgba(0, 0, 0, 0.1);
                background: rgba(0, 0, 0, 0.03);
                color: #444444;
                font-size: 0.82rem;
                font-weight: 700;
                cursor: pointer;
                transition: all 0.2s;
                font-family: inherit;
            }

            body.dark-mode .h2-toggle-btn {
                border-color: rgba(255, 255, 255, 0.1);
                background: rgba(255, 255, 255, 0.05);
                color: #aaaaaa;
            }

            .h2-toggle-btn:hover,
            .h2-toggle-btn.h2-active {
                background: rgba(197, 168, 128, 0.15);
                border-color: var(--gold);
                color: var(--gold);
            }

            /* ── Hamburger toggle button ── */
            .mobile-menu-toggle,
            .mobile-menu-toggle:focus,
            .mobile-menu-toggle:hover,
            .mobile-menu-toggle:active {
                display: flex !important;
                background: transparent !important;
                border: none !important;
                color: var(--navy) !important;
                outline: none !important;
                box-shadow: none !important;
                -webkit-appearance: none !important;
                appearance: none !important;
            }
            
            body.dark-mode .mobile-menu-toggle,
            body.dark-mode .mobile-menu-toggle:focus,
            body.dark-mode .mobile-menu-toggle:hover,
            body.dark-mode .mobile-menu-toggle:active {
                color: #ffffff !important;
            }

            /* ── Header actions hidden on mobile ── */
            .header-actions {
                display: none !important;
            }

            /* ── Hide the mobile-login-container (we replaced it) ── */
            .mobile-login-container {
                display: none !important;
            }

            /* ── Overlay backdrop ── */
            #h2-nav-overlay {
                position: fixed;
                inset: 0;
                background: transparent;
                z-index: 998;
                display: none;
            }

            #h2-nav-overlay.h2-show {
                display: block;
            }
        }
    </style>
</head>
<body class="auth-page">

    <div class="auth-container">
        <!-- Left Side: Forgot Password Form -->
        <div class="auth-form-side">
            <!-- Back to Login Link -->
            <a href="login.html" class="auth-back-link">
                <i class="ph-bold ph-arrow-left"></i> Back to Login
            </a>

            <div class="auth-header">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <!-- ArchStruct Logo -->
                    <a href="index.html" class="auth-logo" style="margin-bottom: 0;">
                        <i class="ph-fill ph-buildings"></i>
                        <span class="auth-logo-title">ArchStruct</span>
                    </a>

                    <!-- Top Actions -->
                    <div class="auth-top-actions" style="position: static; margin: 0;">
                        <div class="toggle-group">
                            <button id="theme-toggle" class="toggle-btn" aria-label="Toggle Dark Mode"><i class="ph-bold ph-moon"></i></button>
                            <div class="toggle-divider"></div>
                            <button id="rtl-toggle" class="toggle-btn toggle-rtl" aria-label="Toggle RTL">RTL</button>
                        </div>
                    </div>
                </div>

                <h1 class="auth-title">Reset Password</h1>
                <p class="auth-subtitle">Enter your email and we'll send you instructions to reset your password.</p>
            </div>

            <!-- Forgot Password Form -->
            <form id="forgotForm">
                <div class="form-group-custom">
                    <span class="input-label-inside">Email Address</span>
                    <input type="email" id="email" class="form-input-custom" placeholder="name@company.com" required>
                </div>

                <button type="submit" class="btn-auth-submit">
                    Send Reset Link
                </button>
            </form>

            <div id="successMessage" style="display: none; margin-top: 1.5rem; padding: 1rem; border-radius: 12px; background-color: rgba(52, 168, 83, 0.1); border: 1px solid rgba(52, 168, 83, 0.2); color: #34A853; text-align: center; font-size: 0.95rem; font-weight: 600;">
                <i class="ph-bold ph-check-circle" style="font-size: 1.2rem; vertical-align: middle; margin-right: 0.5rem;"></i>
                Reset instructions sent successfully! Please check your email.
            </div>

            <p class="auth-footer-text">
                Remember your password? <a href="login.html">Login</a>
            </p>

            <div class="auth-copyright">
                © ArchStruct Design Firm 2026
            </div>
        </div>

        <!-- Right Side: Luxury Brand Visual Container -->
        <div class="auth-visual-side">
            <div class="auth-visual-wrapper">
                <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=800&q=80" alt="Futuristic Architecture" class="auth-visual-img">
                <div class="auth-visual-overlay">
                    <div class="auth-visual-logo-mark">
                        <i class="ph-light ph-buildings"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Theme & Auth Logic Scripts -->
    <script>
        // --- Theme Management ---
        const btn = document.getElementById('theme-toggle');
        const icon = btn.querySelector('i');

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            icon.className = 'ph-bold ph-sun';
        }

        btn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            icon.className = isDark ? 'ph-bold ph-sun' : 'ph-bold ph-moon';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // --- RTL Management ---
        const rtlBtn = document.getElementById('rtl-toggle');
        
        if (localStorage.getItem('dir') === 'rtl') {
            document.documentElement.setAttribute('dir', 'rtl');
        }

        rtlBtn.addEventListener('click', () => {
            const isRtl = document.documentElement.getAttribute('dir') === 'rtl';
            document.documentElement.setAttribute('dir', isRtl ? 'ltr' : 'rtl');
            localStorage.setItem('dir', isRtl ? 'ltr' : 'rtl');
        });

        // --- Simulated Reset Submit ---
        const forgotForm = document.getElementById('forgotForm');
        const successMessage = document.getElementById('successMessage');
        
        forgotForm.addEventListener('submit', (e) => {
            e.preventDefault();
            forgotForm.style.display = 'none';
            successMessage.style.display = 'block';
        });
    </script>
<script>
        // ── Home 2 Sidebar Logic ported to Home 1 ─────────────────────────────────────
        (function () {
            const sidebar = document.getElementById('h2NavSidebar');
            const hamburger = document.querySelector('.mobile-menu-toggle');
            const closeBtn = document.getElementById('h2CloseBtn');
            const themeBtn = document.getElementById('h2ThemeToggle');
            const themeIcon = document.getElementById('h2ThemeIcon');
            const rtlBtn = document.getElementById('h2RtlToggle');

            if (!sidebar || !hamburger) return; // safety check

            // ── Overlay ─────────────────────────────────────────────────────
            const overlay = document.createElement('div');
            overlay.id = 'h2-nav-overlay';
            document.querySelector('.header').appendChild(overlay);

            function openSidebar() {
                sidebar.classList.add('h2-open');
                overlay.classList.add('h2-show');
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('h2-open');
                overlay.classList.remove('h2-show');
                document.body.style.overflow = '';
            }

            hamburger.addEventListener('click', openSidebar);
            if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
            overlay.addEventListener('click', closeSidebar);

            // ── Dropdown accordion ───────────────────────────────────────────
            sidebar.querySelectorAll('.nav-dropdown > a').forEach(trigger => {
                trigger.addEventListener('click', function (e) {
                    const menu = this.nextElementSibling;
                    if (!menu || !menu.classList.contains('dropdown-menu')) return;
                    e.preventDefault();
                    const parent = this.parentElement;
                    const isOpen = parent.classList.contains('h2-dd-open');
                    sidebar.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('h2-dd-open'));
                    if (!isOpen) parent.classList.add('h2-dd-open');
                });
            });

            // Close sidebar when a leaf link is clicked
            sidebar.querySelectorAll('.dropdown-menu a, .h2-nav-body > a').forEach(a => {
                a.addEventListener('click', closeSidebar);
            });

            // ── Dark Mode toggle (sidebar) ──────────────────────────────────
            function syncThemeBtn() {
                const dark = document.body.classList.contains('dark-mode');
                if (themeIcon) themeIcon.className = dark ? 'ph-bold ph-sun' : 'ph-bold ph-moon';
                if (themeBtn) {
                    themeBtn.childNodes[1].textContent = dark ? ' Light Mode' : ' Dark Mode';
                    themeBtn.classList.toggle('h2-active', dark);
                }
            }

            if (themeBtn) {
                syncThemeBtn();
                themeBtn.addEventListener('click', () => {
                    document.body.classList.toggle('dark-mode');
                    const dark = document.body.classList.contains('dark-mode');
                    localStorage.setItem('theme', dark ? 'dark' : 'light');
                    syncThemeBtn();
                });
            }

            // ── RTL toggle (sidebar) ────────────────────────────────────────
            function syncRtlBtn() {
                const rtl = document.documentElement.getAttribute('dir') === 'rtl';
                if (rtlBtn) rtlBtn.classList.toggle('h2-active', rtl);
            }

            if (rtlBtn) {
                syncRtlBtn();
                rtlBtn.addEventListener('click', () => {
                    const rtl = document.documentElement.getAttribute('dir') === 'rtl';
                    document.documentElement.setAttribute('dir', rtl ? 'ltr' : 'rtl');
                    localStorage.setItem('dir', rtl ? 'ltr' : 'rtl');
                    syncRtlBtn();
                });
            }

            // ── Init state from localStorage ────────────────────────────────
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                syncThemeBtn();
            }
            if (localStorage.getItem('dir') === 'rtl') {
                document.documentElement.setAttribute('dir', 'rtl');
                syncRtlBtn();
            }
        })();
    </script>
</body>
</html>
